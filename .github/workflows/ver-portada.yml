name: Ver portada de Play Korsou

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ver-portada.yml

jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar las tres direcciones
        run: |
          for u in https://playkorsou.web.app/ https://playkorsou.web.app/ala-azul https://playkorsou.web.app/tormenta/; do
            code=$(curl -s -o page.html -w "%{http_code}" "$u")
            title=$(grep -o '<title>[^<]*</title>' page.html | head -1)
            echo "$u -> HTTP $code $title ($(wc -c < page.html) bytes)"
          done
